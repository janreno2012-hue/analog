.ft63nav:before,.ft63nav:after{content:'';position:absolute;background:rgba(137,255,250,.34)}.ft63nav:before{left:50%;top:10px;bottom:10px;width:1px}.ft63nav:after{top:50%;left:10px;right:10px;height:1px}.ft63navN{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:10px;color:#bffff9}.ft63navDot{position:absolute;left:43%;top:52%;width:10px;height:10px;border-radius:50%;background:#9ffff7;box-shadow:0 0 12px #8fffff}.ft63navPath{position:absolute;left:49px;top:24px;width:34px;height:52px;border-left:2px solid #8ff;border-bottom:2px solid #8ff;border-radius:0 0 0 20px;transform:rotate(22deg);opacity:.8}.ft63navKm{position:absolute;bottom:8px;right:14px;font-size:11px}
.ft63arrows{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:210px;height:260px;filter:drop-shadow(0 0 10px #8ff8);perspective:300px}.ft63chev{position:absolute;left:50%;width:92px;height:46px;border-left:4px solid rgba(165,255,251,.92);border-top:4px solid rgba(165,255,251,.92);transform:translateX(-50%) rotate(45deg) skew(-4deg,-4deg);transform-origin:center;opacity:.9}.ft63chev.c1{bottom:10px;scale:1.18}.ft63chev.c2{bottom:72px;scale:.86;opacity:.72}.ft63chev.c3{bottom:125px;scale:.62;opacity:.52}.ft63chev.c4{bottom:168px;scale:.42;opacity:.34}.ft63road{position:absolute;left:50%;bottom:0;height:180px;border-left:3px dashed rgba(190,255,252,.55);transform:translateX(-50%)}

.ft63buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}.ft63buttons button{border:1px solid #ffffff55;border-radius:30px;padding:18px 5px;color:white;font-size:18px;font-weight:900;box-shadow:0 7px 18px #0006,inset 0 0 15px #fff1}.ft63start{background:linear-gradient(#20bb82,#118c65)}.ft63pause{background:linear-gradient(#e2b52a,#bc8d0d)}.ft63stop{background:linear-gradient(#ef4857,#c52a38)}.ft63foot{text-align:center;opacity:.65;font-size:11px;padding:13px 4px}
@media(max-width:430px){#ft63a{padding:7px}.ft63brand b{font-size:20px}.ft63icons span{min-width:34px;padding:6px 5px;font-size:11px}.ft63scene{height:57vh;min-height:430px}.ft63nav{width:82px;height:82px;top:34%}.ft63navPath{left:38px;top:19px;width:27px;height:40px}.ft63arrows{height:220px;bottom:14%;transform:translateX(-50%) scale(.86)}.ft63ring{width:61px;height:61px}.ft63m b{font-size:12px}.ft63m span{font-size:8px}.ft63buttons button{font-size:16px;padding:16px 3px}}
</style>
<style id="cleanCoreStyle">
button:disabled{opacity:.35;filter:grayscale(.55);cursor:not-allowed}
#cleanState{position:absolute;left:14px;bottom:14px;z-index:5;padding:7px 11px;border:1px solid rgba(140,255,245,.6);border-radius:14px;background:rgba(0,28,30,.58);font-size:11px;font-weight:800;letter-spacing:.04em;backdrop-filter:blur(4px)}
.ft63scene{isolation:isolate}
</style>
</head><body><div id="ft63a">
 <div class="ft63top"><div class="ft63brand"><b>🌿 歩ログ <small style="display:inline;font-size:14px">ayalog</small></b><small>MARK-II · CLEAN CORE 0.1</small></div><div class="ft63icons"><span id="ft63gps">📍 GPS</span><span id="ft63bell">🐻 OFF</span><span id="ft63bat">🔋 --%</span></div></div>
 <div class="ft63scene"><div id="cleanState">READY · BUS 01</div><video id="ft63video" src="ayalog_green_bg_720p_light.mp4" muted playsinline preload="auto" loop autoplay></video><div class="ft63shade"></div><div class="ft63alt">⛰ 標高<b id="ft63alt">-- m</b></div><div class="ft63hint">FOREST WALK<br><b>FORWARD</b></div><div class="ft63nav"><i class="ft63navN">N</i><i class="ft63navPath"></i><i class="ft63navDot"></i><b class="ft63navKm" id="ft63navKm">0.0 km</b></div><div class="ft63arrows"><i class="ft63road"></i><i class="ft63chev c4"></i><i class="ft63chev c3"></i><i class="ft63chev c2"></i><i class="ft63chev c1"></i></div></div>
 <div class="ft63meters"><div class="ft63m"><div class="ft63ring"><span>◷ 時間</span><b id="ft63time">00:00:00</b></div></div><div class="ft63m"><div class="ft63ring"><span>👣 歩数</span><b id="ft63steps">0</b></div></div><div class="ft63m"><div class="ft63ring"><span>● 距離</span><b id="ft63dist">0 m</b></div></div><div class="ft63m"><div class="ft63ring"><span>◴ 速度</span><b id="ft63speed">0.0</b></div></div><div class="ft63m"><div class="ft63ring"><span>◆ kcal</span><b id="ft63cal">0</b></div></div></div>
 <div class="ft63buttons"><button class="ft63start" id="ft63start">▶ START</button><button class="ft63pause" id="ft63pause" disabled>Ⅱ PAUSE</button><button class="ft63stop" id="ft63stop" disabled>■ STOP</button></div><div class="ft63foot">CLEAN CORE · CONTROL BUS 01</div>
</div>
<script id="cleanCoreController">
(()=>{
 'use strict';
 const $=id=>document.getElementById(id);
 const state={mode:'idle',startedAt:0,elapsed:0,timer:null};
 const start=$('ft63start'), pause=$('ft63pause'), stop=$('ft63stop'), video=$('ft63video');
 const time=$('ft63time'), status=$('cleanState');
 function paint(){
   const sec=Math.floor(state.elapsed/1000), h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');
   time.textContent=`${h}:${m}:${s}`;
   start.disabled=state.mode!=='idle'; pause.disabled=state.mode==='idle'; stop.disabled=state.mode==='idle';
   pause.textContent=state.mode==='paused'?'▶ RESUME':'Ⅱ PAUSE';
   status.textContent=state.mode==='idle'?'READY · BUS 01':state.mode==='paused'?'PAUSED · BUS 01':'RUNNING · BUS 01';
 }
 function beginClock(){clearInterval(state.timer);state.timer=setInterval(()=>{if(state.mode==='running'){state.elapsed=Date.now()-state.startedAt;paint()}},250)}
 function onStart(){if(state.mode!=='idle')return;state.elapsed=0;state.startedAt=Date.now();state.mode='running';beginClock();video?.play().catch(()=>{});paint()}
 function onPause(){if(state.mode==='running'){state.elapsed=Date.now()-state.startedAt;state.mode='paused';video?.pause()}else if(state.mode==='paused'){state.startedAt=Date.now()-state.elapsed;state.mode='running';video?.play().catch(()=>{})}paint()}
 function onStop(){if(state.mode==='idle')return;if(state.mode==='running')state.elapsed=Date.now()-state.startedAt;state.mode='idle';clearInterval(state.timer);state.timer=null;video?.pause();try{if(video)video.currentTime=0}catch(e){}paint()}
 start.addEventListener('click',onStart);pause.addEventListener('click',onPause);stop.addEventListener('click',onStop);paint();
 window.AYALOG_CLEAN_CORE={state,onStart,onPause,onStop};
})();
</script></body></html>
