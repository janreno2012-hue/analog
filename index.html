<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><title>歩ログ Ver.2.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f7;color:#173331;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:620px;margin:auto;padding:16px 12px 40px}header{text-align:center;padding:8px}.logo{font-size:32px;font-weight:800;color:#0f766e}.sub{color:#6b7c79;font-size:13px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #174e4712}h2{font-size:19px;margin:0 0 12px}.status{text-align:center;background:#edf5f4;color:#0f766e;border-radius:14px;padding:11px;font-weight:700}.steps{text-align:center;font-size:54px;font-weight:800;margin-top:8px}.unit{text-align:center;color:#6b7c79}.time{text-align:center;font-size:22px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{border:0;border-radius:13px;padding:13px;font-size:16px;font-weight:700}.start{background:#0f766e;color:white}.stop{background:#f1dddd;color:#b23b3b}button:disabled{opacity:.45}label{display:block;font-size:14px;font-weight:700;margin:11px 0 5px}input{width:100%;padding:12px;border:1px solid #d5dfdd;border-radius:11px;font-size:16px}.save{width:100%;margin-top:15px;background:#115e59;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f1f7f6;border-radius:14px;text-align:center;padding:12px}.value{font-size:23px;font-weight:800}.label,.note,.sub2{font-size:13px;color:#6b7c79}ul{list-style:none;padding:0;margin:0}li{padding:12px 0;border-bottom:1px solid #e5ecea}.del{float:right;padding:6px 9px;font-size:12px;background:#f5eeee;color:#b23b3b}.top{display:flex;justify-content:space-between;font-weight:700}.note{line-height:1.6;margin-top:10px}
</style></head><body><div class="wrap"><header><div class="logo">🌿 歩ログ Ver.2.1</div><div class="sub">STARTからSTOPまで歩数を計測</div></header>
<section class="card"><h2>🚶 ウォーキング</h2><div id="status" class="status">待機中</div><div id="steps" class="steps">0</div><div class="unit">歩</div><div id="timer" class="time">00:00:00</div><div class="buttons"><button id="start" class="start">▶ START</button><button id="stop" class="stop" disabled>■ STOP</button></div><div id="msg" class="note">STARTするとモーションセンサーを使って歩数を推定します。端末・ブラウザによって利用できない場合があります。</div></section>
<section class="card"><h2>📝 今日の記録</h2><label>日付</label><input id="date" type="date"><label>体重（kg）</label><input id="weight" type="number" step="0.1" inputmode="decimal" placeholder="例：65.5"><label>歩数（歩）</label><input id="recsteps" type="number" min="0" inputmode="numeric" placeholder="計測後に自動入力"><button id="save" class="save">💾 記録を保存</button></section>
<section class="card"><h2>📊 これまでの平均</h2><div class="grid"><div class="stat"><div class="label">平均体重</div><div id="aw" class="value">-- kg</div></div><div class="stat"><div class="label">平均歩数</div><div id="as" class="value">-- 歩</div></div></div></section>
<section class="card"><h2>📚 過去の記録</h2><ul id="list"></ul></section></div>
<script>
const KEY="ayalog_records_v21";let data=JSON.parse(localStorage.getItem(KEY)||"[]"),running=false,n=0,t0=0,timer=null,last=0,prev=0,handler=null;
const $=x=>document.getElementById(x);$("date").value=new Date().toISOString().slice(0,10);
function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}function pad(x){return String(x).padStart(2,"0")}
function tick(){let s=Math.floor((Date.now()-t0)/1000);$("timer").textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function motion(e){if(!running||!e.accelerationIncludingGravity)return;let a=e.accelerationIncludingGravity,m=Math.hypot(a.x||0,a.y||0,a.z||0),d=m-prev;prev=m;let now=Date.now();if(d>1.15&&m>10.2&&now-last>280){n++;$("steps").textContent=n;$("recsteps").value=n;last=now}}
async function permission(){if(typeof DeviceMotionEvent==="undefined"){ $("msg").textContent="このブラウザではモーションセンサーを利用できません。";return false}try{if(typeof DeviceMotionEvent.requestPermission==="function"&&await DeviceMotionEvent.requestPermission()!=="granted"){ $("msg").textContent="モーションセンサーの許可が必要です。";return false}handler=motion;addEventListener("devicemotion",handler);return true}catch(e){$("msg").textContent="センサーを開始できません。HTTPSのGitHub Pagesで開いてください。";return false}}
$("start").onclick=async()=>{if(running)return;if(!await permission())return;running=true;n=0;last=0;prev=0;$("steps").textContent=0;$("recsteps").value="";t0=Date.now();tick();timer=setInterval(tick,1000);$("status").textContent="歩数計測中…";$("start").disabled=true;$("stop").disabled=false;$("msg").textContent="計測中です。スマホを持って歩いてみてください。"}
$("stop").onclick=()=>{running=false;if(handler)removeEventListener("devicemotion",handler);handler=null;clearInterval(timer);$("status").textContent="計測終了";$("start").disabled=false;$("stop").disabled=true;$("msg").textContent="今回の計測："+n.toLocaleString()+"歩。体重を入力して保存できます。"}
$("save").onclick=()=>{let w=parseFloat($("weight").value),s=parseInt($("recsteps").value,10);if(!Number.isFinite(w)||w<=0){alert("体重を入力してください。");return}if(!Number.isFinite(s)||s<0){alert("歩数を入力してください。");return}data.push({id:Date.now(),date:$("date").value,weight:w,steps:s});data.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);saveData();render();$("weight").value="";$("recsteps").value="";alert("記録を保存しました。")}
function render(){let ws=data.map(x=>x.weight),ss=data.map(x=>x.steps);$("aw").textContent=ws.length?(ws.reduce((a,b)=>a+b,0)/ws.length).toFixed(1)+" kg":"-- kg";$("as").textContent=ss.length?Math.round(ss.reduce((a,b)=>a+b,0)/ss.length).toLocaleString()+" 歩":"-- 歩";$("list").innerHTML=data.length?data.map(x=>'<li><button class="del" data-id="'+x.id+'">削除</button><div class="top"><span>'+x.date+'</span><span>'+x.weight.toFixed(1)+' kg</span></div><div class="sub2">歩数：'+x.steps.toLocaleString()+' 歩</div></li>').join(""):'<li style="text-align:center;color:#6b7c79">まだ記録がありません。</li>';$("list").querySelectorAll(".del").forEach(b=>b.onclick=()=>{data=data.filter(x=>x.id!=b.dataset.id);saveData();render()})}render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script></body></html>
