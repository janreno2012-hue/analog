<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS Minimal Test</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#eef6f5;color:#163b3a;margin:0;padding:18px}
.card{max-width:560px;margin:auto;background:white;border-radius:20px;padding:18px;box-shadow:0 6px 22px #0001}
button{width:100%;padding:16px;border:0;border-radius:14px;background:#0f766e;color:#fff;font-size:18px;font-weight:800}
pre{white-space:pre-wrap;background:#0f3036;color:#eafffb;padding:14px;border-radius:14px;min-height:150px}
.small{color:#607976;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h2>📡 GPS 最小テスト</h2>
<p class="small">歩ログ本体のコードを一切使わず、ブラウザの Geolocation API だけを直接確認します。</p>
<button id="go">GPSをテスト</button>
<pre id="log">待機中</pre>
</div>
<script>
const logEl=document.getElementById("log");
const log=(m)=>logEl.textContent += "\n"+m;
document.getElementById("go").onclick=async()=>{
  logEl.textContent="開始";
  log("secureContext="+window.isSecureContext);
  log("origin="+location.origin);
  log("geolocation="+(!!navigator.geolocation));
  if(navigator.permissions?.query){
    try{
      const p=await navigator.permissions.query({name:"geolocation"});
      log("permissions.state="+p.state);
    }catch(e){log("permissions.query ERROR: "+e);}
  }
  if(!navigator.geolocation){log("Geolocation APIなし");return;}
  log("getCurrentPosition 要求中...");
  navigator.geolocation.getCurrentPosition(
    p=>{
      log("SUCCESS");
      log("lat="+p.coords.latitude);
      log("lng="+p.coords.longitude);
      log("accuracy="+Math.round(p.coords.accuracy||0)+"m");
    },
    e=>{
      log("ERROR code="+e.code);
      log("message="+e.message);
      const name={1:"PERMISSION_DENIED",2:"POSITION_UNAVAILABLE",3:"TIMEOUT"}[e.code]||"UNKNOWN";
      log("name="+name);
    },
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
};
</script>
</body>
</html>
